name: CI

on:
  pull_request:
  push:
    branches: [main, testing-master]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/fashion_erp"
      NEXTAUTH_SECRET: "ci-placeholder-secret-not-used-for-anything-real"
      NEXTAUTH_URL: "http://localhost:3000"
      # This codebase has grown large enough that a plain default-heap
      # `tsc`/`eslint` invocation can hit V8's own ~2GB old-space ceiling —
      # already well-documented as a local-dev gotcha (see CLAUDE.md), now
      # also hit on the GitHub-hosted runner's default Node heap (confirmed
      # live: `tsc --noEmit` OOM'd right around that ~2GB ceiling). 4096
      # gives real headroom over that without crowding out the runner's own
      # ~7GB total RAM alongside the Postgres service container. Job-level
      # so every step (Type check/Lint/Build) gets it, not just one.
      NODE_OPTIONS: "--max-old-space-size=4096"
    # Matches the documented local dev Postgres version (CLAUDE.md: "PostgreSQL
    # 16 installed locally via winget"). Every existing test mocks the
    # Prisma/repository layer — this container's sole purpose is the
    # "Apply migrations" step below, which is otherwise zero automated
    # verification that the 47+ migration files in this repo actually apply
    # cleanly, in order, against a real Postgres instance (flagged by the
    # independent hardening audit as a real CI gap, not a hypothetical one).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fashion_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations to a real Postgres instance
        run: npx prisma migrate deploy

      # RootLayout's `LayoutProps<"/">` (src/app/layout.tsx) is one of
      # Next.js's own generated ambient types, written to .next/types — only
      # produced by `next dev`/`next build`, neither of which has run yet at
      # this point in the job. `next typegen` produces the same generated
      # types without a full build, so a standalone `tsc --noEmit` (which
      # has to run before Build, to fail fast) can actually resolve it.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
