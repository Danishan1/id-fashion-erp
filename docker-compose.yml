# Runs the Fashion ERP app + background worker in Docker.
# Uses the Postgres running on the host machine (your existing data) via
# host.docker.internal, and the REDIS_URL from .env.
services:
  app:
    build: .
    image: fashion-erp:latest
    env_file: .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      NEXTAUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      FILE_STORAGE_ROOT: /app/storage
    ports:
      - "3000:3000"
    volumes:
      - ./storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker:
    image: fashion-erp:latest
    depends_on:
      - app
    env_file: .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      FILE_STORAGE_ROOT: /app/storage
    command: ["npx", "tsx", "src/core/jobs/worker.ts"]
    volumes:
      - ./storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
